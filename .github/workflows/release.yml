# Builds the release binaries. Called by the semantic-release workflow with the tag it just made,
# it publishes them to that tag's GitHub Release. A manual run, or a PR that touches the build, only
# uploads them as workflow artifacts. Runbook: docs/releasing.md.
name: release

on:
  # A tag pushed with GITHUB_TOKEN starts no workflow, so semantic-release.yml calls this one.
  workflow_call:
    inputs:
      tag:
        description: The v<version> tag to build and publish
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: A v<version> tag to build instead of the branch (nothing is published)
        type: string
        required: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - build.zig
      - build.zig.zon

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MISE_ENABLE_TOOLS: zig
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag when one is given; otherwise empty, which checks out the branch or PR the run is for.
          ref: ${{ inputs.tag }}
      - uses: jdx/mise-action@v5

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^ *\.version = "\(.*\)",$/\1/p' build.zig.zon)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build.zig.zon version: $version"

      - name: The tag matches the version
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG doesn't match build.zig.zon's .version ($VERSION): expected v$VERSION"
            exit 1
          fi

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          # <asset os>-<asset arch> <zig target> <extra flags>. The Linux builds are static
          # and stripped (about 14 MB with debug info); the macOS ones link only the system library.
          while read -r os arch target flags; do
            name="am-$VERSION-$os-$arch"
            # $flags is unquoted on purpose: it holds zero or more flags.
            # shellcheck disable=SC2086
            zig build -Doptimize=ReleaseSafe -Dtarget="$target" $flags --prefix "build/$name"
            mkdir "dist/$name"
            cp "build/$name/bin/am" LICENSE README.md "dist/$name/"
            tar -C dist --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" "$name"
            rm -r "dist/$name"
          done <<'EOF'
          macos arm64 aarch64-macos
          macos x86_64 x86_64-macos
          linux arm64 aarch64-linux-musl -Dstrip
          linux x86_64 x86_64-linux-musl -Dstrip
          EOF
          cd dist
          sha256sum am-*.tar.gz > "am-$VERSION-checksums.txt"
          cat "am-$VERSION-checksums.txt"

      - name: The binary built for this runner reports the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          file build/*/bin/am
          test "$("build/am-$VERSION-linux-x86_64/bin/am" --version)" = "am $VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: am-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    # Only the call from semantic-release.yml (a push to main) publishes; a manual run, even with
    # a tag, stops at the artifact.
    if: github.event_name == 'push' && inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
